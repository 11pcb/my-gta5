
name: Download GTA5

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check available disk
        run: df -h /

      - name: Download and extract game
        run: python download_game.py

      - name: Check downloaded files
        if: always()
        run: |
          df -h /
          du -sh mirror/ 2>/dev/null || true
