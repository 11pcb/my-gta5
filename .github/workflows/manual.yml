
name: HF to Cloudflare Pages Manual Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Download Hugging Face dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$HF_TOKEN" || {
            echo "HF_TOKEN secret missing"
            exit 1
          }

          git clone \
            --depth 1 \
            https://huggingface.co/datasets/files-im009/cloudflare09 \
            pages-output

          git -C pages-output remote set-url origin \
            https://huggingface.co/datasets/files-im009/cloudflare09

          git -C pages-output lfs pull \
            --include="*" \
            --exclude=""

          rm -rf pages-output/.git

          test "$(find pages-output -type f | wc -l)" -gt 0

          echo "Download complete"
          du -sh pages-output
          df -h /

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          npx --yes wrangler@latest pages deploy pages-output \
            --project-name=updatedgta5 \
            --branch=main \
            --commit-dirty=true

      - name: Final disk check
        if: always()
        run: df -h /
