
name: HF to Cloudflare Pages Manual Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. Free disk space
      - name: Clean runner disk
        run: |
          sudo apt-get clean
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost
          df -h /

      # 2. Setup Git LFS (already available on runner)
      - name: Setup Git LFS
        run: |
          git lfs version
          git lfs install

      # 3. Download Hugging Face dataset
      - name: Download from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$HF_TOKEN" ]; then
            echo "ERROR: HF_TOKEN secret is missing."
            exit 1
          fi

          echo "Cloning dataset..."

          git clone \
            "https://oauth2:${HF_TOKEN}@huggingface.co/datasets/files-im009/cloudflare09" \
            pages-output

          echo "Downloading actual LFS files..."

          git -C pages-output lfs pull

          echo "Removing Git metadata..."
          rm -rf pages-output/.git

          FILE_COUNT=$(find pages-output -type f | wc -l)

          echo "Total files: $FILE_COUNT"
          echo "Dataset size:"
          du -sh pages-output

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No files downloaded."
            exit 1
          fi

          echo "Download verification completed."

      # 4. Deploy to Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: Cloudflare API token missing."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ERROR: Cloudflare Account ID missing."
            exit 1
          fi

          npx --yes wrangler@latest pages deploy pages-output \
            --project-name=updatedgta5 \
            --branch=main \
            --commit-dirty=true

      # 5. Final disk check
      - name: Final disk check
        if: always()
        run: df -h /
