name: GTA5 Build and Deploy to HF Space

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy-space:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. Get repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Clean unused runner tools to free disk space
      - name: Clean runner disk
        run: |
          sudo apt-get clean
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost

          echo "Disk after cleanup:"
          df -h /

      # 4. Download and extract game
      - name: Download GTA5 files
        run: |
          python -u download_game.py

      # 5. Build Pages output
      - name: Build GTA5 Pages
        run: |
          python -u build_pages.py

      # 6. Upload Build Output directly to Hugging Face Space
      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e

          if [ -z "$HF_TOKEN" ]; then
            echo "ERROR: Hugging Face secret (HF_TOKEN) is missing."
            exit 1
          fi

          pip install --upgrade huggingface_hub

          python -c "
          import os
          from huggingface_hub import HfApi

          api = HfApi()

          print('Uploading build output to Hugging Face Space...')
          api.upload_folder(
              folder_path='pages-output',
              repo_id='files-im009/pankajgta5',
              repo_type='space',
              token=os.environ['HF_TOKEN']
          )
          print('Successfully deployed to Hugging Face Space!')
          "
