name: GTA5 Manual Download and Upload to Hugging Face

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. Get repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Initial disk check
      - name: Check initial disk
        run: |
          echo "Initial disk space:"
          df -h /

      # 4. Clean unused runner tools
      - name: Clean runner disk
        run: |
          sudo apt-get clean

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost

          echo "Disk after cleanup:"
          df -h /

      # 5. Download and extract game
      - name: Download GTA5 files
        run: |
          python -u download_game.py

      # 6. Verify downloaded files
      - name: Check downloaded files
        run: |
          echo "Mirror size:"
          du -sh mirror/ 2>/dev/null || true

          echo "Installed parts:"
          ls -lh .installed-parts/ 2>/dev/null || true

          echo "Available disk:"
          df -h /

      # 7. Upload downloaded files to Hugging Face
      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e

          if [ -z "$HF_TOKEN" ]; then
            echo "ERROR: Hugging Face secret (HF_TOKEN) is missing."
            exit 1
          fi

          pip install --upgrade huggingface_hub

          python -c "
          import os
          from huggingface_hub import HfApi

          api = HfApi()

          # Game files 'mirror' folder mein download hoti hain, isliye wahi upload hoga
          folder_to_upload = 'mirror'
          if not os.path.exists(folder_to_upload):
              folder_to_upload = '.'

          print(f'Uploading folder: {folder_to_upload} to Hugging Face...')
          api.upload_folder(
              folder_path=folder_to_upload,
              repo_id='files-im009/my-gta5',
              repo_type='dataset',
              token=os.environ['HF_TOKEN']
          )
          print('Successfully uploaded to Hugging Face Dataset!')
          "

      # 8. Final report
      - name: Check installed files
        if: always()
        run: |
          echo "Installed receipts:"
          ls -lh .installed-parts/ 2>/dev/null || true

          echo "Download folder:"
          du -sh .downloads/ 2>/dev/null || true

          echo "Final disk:"
          df -h /
