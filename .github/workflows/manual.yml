
name: GTA5 Manual Download

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. Get repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Check initial disk space
      - name: Check initial disk
        run: |
          echo "Initial disk space:"
          df -h /

      # 4. Clean unused preinstalled tools
      - name: Clean runner disk
        run: |
          sudo apt-get clean

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost

          echo "Disk after cleanup:"
          df -h /

      # 5. Download and extract game
      - name: Download GTA5 files
        run: |
          python -u download_game.py

      # 6. Verify downloaded files
      - name: Check downloaded files
        if: always()
        run: |
          echo "Final disk:"
          df -h /

          echo "Mirror size:"
          du -sh mirror/ 2>/dev/null || true

          echo "Installed parts:"
          ls -lh .installed-parts/ 2>/dev/null || true

          echo "Download folder:"
          du -sh .downloads/ 2>/dev/null || true
