
name: Manual GTA5 Workflow

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check available storage
        run: |
          df -h /

      - name: Check project files
        run: |
          ls -lh
          python --version

      - name: Check Python scripts
        run: |
          python -m py_compile download_game.py
          python -m py_compile build_web.py
          python -m py_compile build_pages.py
          python -m py_compile serve_local.py

      - name: Finish
        run: echo "GTA5 project checks completed!"
