
name: HF to Cloudflare Pages Manual Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. Clean runner disk
      - name: Clean runner disk
        run: |
          sudo apt-get clean
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost
          df -h /

      # 2. Setup Git LFS
      - name: Setup Git LFS
        run: |
          git lfs version
          git lfs install

      # 3. Download files from Hugging Face
      - name: Download from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$HF_TOKEN" ]; then
            echo "ERROR: HF_TOKEN secret is missing."
            exit 1
          fi

          git clone \
            "https://oauth2:${HF_TOKEN}@huggingface.co/datasets/files-im009/cloudflare09" \
            pages-output

          git -C pages-output lfs pull

          rm -rf pages-output/.git

          FILE_COUNT=$(find pages-output -type f | wc -l)

          echo "Total files: $FILE_COUNT"
          du -sh pages-output

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No files downloaded."
            exit 1
          fi

      # 4. Configure browser isolation headers
      - name: Configure browser isolation headers
        run: |
          cat > pages-output/_headers <<'EOF'
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp
          EOF

          echo "Browser isolation headers configured."

      # 5. Deploy to Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: Cloudflare API Token missing."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ERROR: Cloudflare Account ID missing."
            exit 1
          fi

          npx --yes wrangler@latest pages deploy pages-output \
            --project-name=updatedgta5 \
            --branch=main \
            --commit-dirty=true

      # 6. Final disk check
      - name: Final disk check
        if: always()
        run: |
          df -h /
