name: Download from HF and Deploy to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-to-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. Get repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Initial disk check
      - name: Check initial disk
        run: |
          echo "Initial disk space:"
          df -h /

      # 4. Clean unused runner tools to free up space
      - name: Clean runner disk
        run: |
          sudo apt-get clean
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost
          echo "Disk after cleanup:"
          df -h /

      # 5. Download files from Hugging Face dataset
      - name: Download from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          pip install -U huggingface_hub

          python -c "
          from huggingface_hub import snapshot_download
          import os

          token = os.environ.get('HF_TOKEN')
          print('Downloading dataset files from Hugging Face...')
          
          snapshot_download(
              repo_id='files-im009/cloudflare09',
              repo_type='dataset',
              local_dir='pages-output',
              token=token
          )
          print('Download completed successfully!')
          "

      # 6. Verify downloaded files
      - name: Verify Pages output
        run: |
          set -e
          test -d pages-output

          FILE_COUNT=$(find pages-output -type f | wc -l)
          echo "Total files downloaded: $FILE_COUNT"

          if [ "$FILE_COUNT" -gt 20000 ]; then
            echo "ERROR: Cloudflare Pages file limit exceeded."
            exit 1
          fi

          echo "Folder size:"
          du -sh pages-output/
          echo "Verification successful."

      # 7. Deploy to Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e

          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ERROR: Cloudflare GitHub Secrets are missing."
            exit 1
          fi

          npx wrangler@latest pages deploy pages-output \
            --project-name=updatedgta5 \
            --branch=main

      # 8. Final Disk Check
      - name: Final disk check
        if: always()
        run: |
          df -h /
